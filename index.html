<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Menovia — игровой путь</title>
<style>
:root{
  --green:#58cc02; --green-dark:#46a302; --green-bg:#d7ffb8;
  --red:#ff4b4b; --red-dark:#ea2b2b; --red-bg:#ffdfe0;
  --blue:#1cb0f6; --blue-dark:#1899d6; --blue-bg:#ddf4ff;
  --yellow:#ffc800; --purple:#8064d8; --purple-light:#f0ebff;
  --ink:#3c3c3c; --muted:#afafaf; --line:#e5e5e5; --bg:#fff;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.45; overflow-x:hidden;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}

/* ===== TOP BAR ===== */
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line);
  padding:10px 16px; display:flex; gap:18px; align-items:center;
  font-weight:800; font-size:15px;
}
.stat{display:flex;align-items:center;gap:5px}
.stat .icon{font-size:18px}
.stat.streak{color:#ff9600}
.stat.xp{color:var(--purple)}
.stat.level{color:var(--blue); margin-left:auto}
.level-badge{
  background:var(--blue); color:#fff; border-radius:20px;
  padding:2px 10px; font-size:12px; font-weight:800;
}

/* ===== MAP VIEW ===== */
.map{padding:20px 16px 40px}
.map-title{font-size:26px;font-weight:800;margin:0 0 4px}
.map-sub{color:var(--muted);font-size:14px;margin:0 0 24px}

.path{display:flex;flex-direction:column;align-items:center;gap:0}

.node-wrap{
  display:flex;flex-direction:column;align-items:center;
  margin:10px 0; transition:.3s;
}
.node-wrap:nth-child(4n+1){margin-left:-80px}
.node-wrap:nth-child(4n+2){margin-left:40px}
.node-wrap:nth-child(4n+3){margin-left:-40px}
.node-wrap:nth-child(4n+4){margin-left:80px}

.node{
  width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;font-size:34px;
  background:var(--purple); color:#fff;
  border-bottom:6px solid #5b44a8;
  cursor:pointer; transition:transform .1s;
  position:relative;
}
.node:active:not(.locked){transform:translateY(3px);border-bottom-width:3px}
.node.done{background:var(--green);border-bottom-color:var(--green-dark)}
.node.current{
  animation:bounce 1.4s infinite;
  box-shadow:0 0 0 8px #8064d820;
}
.node.locked{background:#e5e5e5;border-bottom-color:#c4c4c4;color:#afafaf;cursor:not-allowed}
.node .check{font-size:38px}
.node-label{
  margin-top:8px;font-weight:800;font-size:14px;text-align:center;
}
.node-wrap.locked .node-label{color:var(--muted)}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

.connector{
  width:4px;height:18px;background:#e5e5e5;border-radius:2px;
  margin:0;
}

/* Side cards */
.side-card{
  background:#f7f7f7;border-radius:var(--radius);padding:16px;
  margin-top:24px;
}
.side-card h3{margin:0 0 10px;font-size:15px}
.quest{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.quest .dot{
  width:22px;height:22px;border-radius:50%;background:#e5e5e5;
  display:grid;place-items:center;font-size:12px;color:#fff;flex:0 0 auto;
}
.quest.done .dot{background:var(--green)}
.quest.done .q-text{text-decoration:line-through;color:var(--muted)}

/* ===== LESSON VIEW ===== */
.lesson{
  display:flex;flex-direction:column;min-height:100vh;
  position:relative;
}
.lesson-head{
  padding:14px 16px; display:flex; align-items:center; gap:12px;
}
.close-btn{
  background:none;border:none;font-size:24px;color:var(--muted);
  cursor:pointer;padding:0;width:32px;height:32px;
  display:grid;place-items:center;border-radius:8px;
}
.close-btn:hover{background:#f0f0f0}
.progress{
  flex:1;height:14px;background:#e5e5e5;border-radius:10px;
  overflow:hidden;
}
.progress-fill{
  height:100%;background:var(--green);border-radius:10px;
  transition:width .4s cubic-bezier(.4,0,.2,1);
  width:0;
}

.lesson-body{
  flex:1; padding:20px 20px 140px;
}

.mia-line{
  display:flex;gap:12px;align-items:flex-start;margin-bottom:20px;
}
.mia-avatar{
  width:60px;height:60px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%, #ffe9a8, #f5b800);
  display:grid;place-items:center;font-size:28px;
  box-shadow:0 4px 12px #f5b80040;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
.mia-bubble{
  background:#f0f0f0;border-radius:16px 16px 16px 4px;
  padding:12px 16px;font-size:14px;flex:1;
}
.mia-bubble strong{color:var(--purple)}

.question-text{
  font-size:22px;font-weight:800;margin:0 0 8px;line-height:1.3;
}
.question-hint{
  color:var(--muted);font-size:14px;margin:0 0 20px;
}

.options{display:flex;flex-direction:column;gap:12px}
.option{
  border:2px solid var(--line);border-bottom-width:4px;
  border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;
  background:#fff;text-align:left;cursor:pointer;
  transition:transform .08s, background .15s, border-color .15s;
  font-family:inherit;color:var(--ink);
}
.option:active:not(.disabled){
  transform:translateY(2px);border-bottom-width:2px;
}
.option.selected{
  border-color:#84d8ff;border-bottom-color:var(--blue);
  background:var(--blue-bg);color:#1899d6;
}
.option.correct{
  border-color:#b8f28b;border-bottom-color:var(--green);
  background:var(--green-bg);color:#58a700;
}
.option.wrong{
  border-color:#ffb3b3;border-bottom-color:var(--red);
  background:var(--red-bg);color:var(--red-dark);
}
.option.disabled{cursor:not-allowed}

/* ===== BOTTOM ACTION BAR ===== */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid var(--line);
  padding:16px; z-index:20;
  max-width:520px;margin:0 auto;
}
.btn{
  width:100%;border:none;border-radius:14px;
  padding:14px;font-family:inherit;font-weight:800;font-size:15px;
  text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;
  transition:transform .05s;
}
.btn-3d{
  border-bottom:4px solid;
  transition:transform .05s, border-bottom-width .05s;
}
.btn-3d:active:not(:disabled){
  transform:translateY(2px);border-bottom-width:2px;
}
.btn-primary{
  background:var(--green);color:#fff;border-bottom-color:var(--green-dark);
}
.btn-primary:disabled{
  background:#e5e5e5;border-bottom-color:#c4c4c4;
  color:var(--muted);cursor:not-allowed;
}
.btn-wrong{
  background:var(--red);color:#fff;border-bottom-color:var(--red-dark);
}

/* ===== FEEDBACK PANEL ===== */
.feedback{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  padding:16px; max-width:520px;margin:0 auto;
  animation:slideUp .25s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;gap:12px;
}
@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}
.feedback.correct{
  background:var(--green-bg);border-top:2px solid var(--green);
}
.feedback.wrong{
  background:var(--red-bg);border-top:2px solid var(--red);
}
.feedback-head{
  display:flex;align-items:center;gap:10px;
  font-size:18px;font-weight:800;
}
.feedback.correct .feedback-head{color:var(--green-dark)}
.feedback.wrong .feedback-head{color:var(--red-dark)}
.feedback-explain{
  font-size:14px;color:var(--ink);line-height:1.5;
}

/* ===== RESULTS ===== */
.results{
  padding:40px 20px;text-align:center;
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;position:relative;
}
.results h1{font-size:28px;margin:0 0 8px}
.results .big-emoji{font-size:80px;animation:pop .6s ease}
@keyframes pop{
  0%{transform:scale(0) rotate(-20deg)}
  60%{transform:scale(1.2) rotate(10deg)}
  100%{transform:scale(1) rotate(0)}
}
.result-stats{
  display:flex;gap:20px;margin:24px 0;
}
.result-stat{
  background:#f7f7f7;border-radius:16px;padding:16px 24px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.result-stat .val{font-size:26px;font-weight:800;color:var(--purple)}
.result-stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

/* ===== XP FLOAT ===== */
.xp-float{
  position:fixed;pointer-events:none;z-index:100;
  font-weight:800;font-size:24px;color:var(--purple);
  animation:xpFly 1.2s ease forwards;
}
@keyframes xpFly{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-120px) scale(1.4)}
}

/* ===== CONFETTI ===== */
.confetti-piece{
  position:fixed;width:10px;height:14px;
  z-index:100;pointer-events:none;
  animation:confettiFall 2s linear forwards;
}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(-20px) rotate(0)}
  100%{opacity:0;transform:translateY(100vh) rotate(720deg)}
}

/* ===== MODAL (level up / achievements) ===== */
.modal-backdrop{
  position:fixed;inset:0;background:#00000088;
  display:grid;place-items:center;z-index:200;padding:20px;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  background:#fff;border-radius:24px;padding:28px;
  max-width:380px;width:100%;text-align:center;
  animation:pop .4s ease;
}
.modal-card h2{margin:0 0 8px;font-size:22px}
.modal-card p{margin:0 0 20px;color:var(--muted);font-size:14px}

/* ===== ACHIEVEMENTS ===== */
.ach-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.ach{
  background:#f7f7f7;border-radius:12px;padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  text-align:center;
}
.ach.locked{opacity:.35}
.ach-icon{font-size:26px}
.ach-name{font-size:10px;font-weight:700;line-height:1.2}

/* ===== UTIL ===== */
.hidden{display:none!important}
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar hidden" id="topbar">
    <div class="stat streak">
      <span class="icon">🔥</span><span id="streak-val">0</span>
    </div>
    <div class="stat xp">
      <span class="icon">⭐</span><span id="xp-val">0</span>
    </div>
    <div class="stat level">
      <span class="level-badge" id="level-val">1</span>
    </div>
  </div>

  <!-- VIEW -->
  <div id="view"></div>

</div>

<!-- CONFETTI ROOT -->
<div id="confetti-root"></div>

<script>
/* ============================================================
   1. КОНСТАНТЫ И ДАННЫЕ
============================================================ */

const STORE_KEY = 'menovia_game_v1';

// Уровни — прогрессивные пороги XP
const LEVELS = [
  { n:1, xp:0,    title:'Первый шаг' },
  { n:2, xp:40,   title:'Исследовательница' },
  { n:3, xp:100,  title:'Знаток себя' },
  { n:4, xp:200,  title:'Наблюдательница' },
  { n:5, xp:350,  title:'Заботливая' },
  { n:6, xp:550,  title:'Уверенная' },
  { n:7, xp:800,  title:'Наставница' }
];

const ACHIEVEMENTS = [
  { id:'first_lesson', icon:'🌱', name:'Первый шаг' },
  { id:'streak_3',     icon:'🔥', name:'3 дня' },
  { id:'streak_7',     icon:'💎', name:'Неделя' },
  { id:'all_chapters', icon:'🏆', name:'Все главы' },
  { id:'quiz_master',  icon:'🧠', name:'Знаток' },
  { id:'night_owl',    icon:'🌙', name:'Полуночница' }
];

const MIA_CORRECT = ['Отлично!', 'Здорово 💜', 'Точно!', 'Ты справляешься!', 'Так держать!'];
const MIA_SELF    = ['Спасибо, записала', 'Понятно 💜', 'Хорошо, отмечено', 'Спасибо!'];
const MIA_WRONG   = ['Ничего страшного', 'Учимся вместе', 'Вот как это работает'];
const MIA_INTRO   = [
  'Привет! Я Мия ✨ Будем знакомиться с твоим телом — без оценок.',
  'Каждый ответ — это забота о себе. Поехали!',
  'Готова? Это займёт пару минут 💜'
];

const CHAPTERS = [
  {
    id:'cycle',
    title:'Мой цикл',
    icon:'🌙',
    color:'#8064d8',
    questions:[
      {
        id:'age', type:'self',
        question:'Сколько тебе лет?',
        hint:'Это поможет подобрать подходящую информацию',
        options:['11–13','14–16','17–19','Предпочитаю не говорить']
      },
      {
        id:'menarche', type:'self',
        question:'У тебя уже начались месячные?',
        options:['Да','Нет','Не уверена']
      },
      {
        id:'cycle_reg', type:'self',
        question:'Как обычно приходят месячные?',
        options:['Регулярно','Иногда задерживаются','Сильно различаются','Пока трудно понять']
      },
      {
        id:'q_cycle_quiz', type:'quiz',
        question:'Правда ли, что в первые годы после начала месячных цикл может быть нерегулярным?',
        options:['Да, это обычно','Нет, всегда должен быть ровно 28 дней'],
        correct: 0,
        explanation:'В первые 2–3 года после менархе цикл часто только устанавливается — это нормально и не требует тревоги.'
      }
    ]
  },
  {
    id:'wellbeing',
    title:'Самочувствие',
    icon:'💜',
    color:'#e91e63',
    questions:[
      {
        id:'pain', type:'self',
        question:'Бывает ли у тебя боль внизу живота?',
        options:['Нет','Иногда','Часто','Почти каждый цикл']
      },
      {
        id:'pain_impact', type:'self',
        question:'Мешает ли боль обычным делам?',
        options:['Не мешает','Немного','Приходится что-то отменять','Часто не могу ничего делать'],
        showIf:{ id:'pain', notValue:'Нет' }
      },
      {
        id:'discharge', type:'self',
        question:'Замечала ли изменения выделений?',
        options:['Нет','Стало больше','Изменился цвет','Непривычный запах','Есть кровь вне цикла']
      },
      {
        id:'q_wellbeing_quiz', type:'quiz',
        question:'Можно ли по одному описанию выделений точно поставить диагноз?',
        options:['Да, это надёжно','Нет, нужен осмотр врача'],
        correct: 1,
        explanation:'По описанию выделений нельзя точно определить причину. Это может быть норма, инфекция или раздражение — нужен врач.'
      }
    ]
  },
  {
    id:'sleep',
    title:'Сон и настроение',
    icon:'⭐',
    color:'#1cb0f6',
    questions:[
      {
        id:'sleep_hours', type:'self',
        question:'Сколько часов ты обычно спишь?',
        options:['Меньше 6','6–7','8–9','Больше 9']
      },
      {
        id:'mood', type:'self',
        question:'Как чаще всего было настроение на этой неделе?',
        options:['Хорошее','Спокойное','Никакое','Грустное','Тревожное']
      },
      {
        id:'mood_impact', type:'self',
        question:'Мешало ли настроение обычным делам?',
        options:['Нет','Немного','Да']
      },
      {
        id:'q_sleep_quiz', type:'quiz',
        question:'Сколько сна обычно рекомендуют подросткам?',
        options:['5–6 часов','6–7 часов','8–10 часов','Больше 12 часов'],
        correct: 2,
        explanation:'Подросткам рекомендуется 8–10 часов сна: он влияет на настроение, учёбу и гормональный фон.'
      }
    ]
  }
];

/* ============================================================
   2. СОСТОЯНИЕ
============================================================ */

let state = loadState() || defaultState();

function defaultState(){
  return {
    xp: 0,
    level: 1,
    streak: 0,
    lastActiveDate: null,
    completedChapters: [],
    answers: {},
    quizCorrect: 0,
    achievements: [],
    view: 'map',           // 'map' | 'lesson' | 'results'
    currentChapterId: null,
    currentQuestionIdx: 0,
    selectedAnswer: null,
    checked: null,         // null | 'correct' | 'wrong' | 'self'
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    return Object.assign(defaultState(), JSON.parse(raw));
  } catch(e){ return null; }
}

function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}

/* ============================================================
   3. УТИЛИТЫ
============================================================ */

const $ = id => document.getElementById(id);
const todayKey = () => new Date().toISOString().slice(0,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const rand = arr => arr[Math.floor(Math.random()*arr.length)];

function getLevelForXp(xp){
  let lvl = LEVELS[0];
  for(const l of LEVELS){ if(xp >= l.xp) lvl = l; else break; }
  return lvl;
}

function getNextLevel(xp){
  return LEVELS.find(l => l.xp > xp) || null;
}

/* ============================================================
   4. СТРИК (МЯГКИЙ)
============================================================ */

function updateStreak(){
  const today = todayKey();
  if(state.lastActiveDate === today) return;
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate()-1);
  const yKey = yesterday.toISOString().slice(0,10);

  if(state.lastActiveDate === yKey){
    state.streak++;
  } else {
    // Мягкий сброс: не обнуляем агрессивно — даём «второй шанс»
    // (в реальном приложении тут была бы «заморозка стрика»)
    state.streak = Math.max(1, Math.min(state.streak, 1));
  }
  state.lastActiveDate = today;

  if(state.streak === 3) unlockAchievement('streak_3');
  if(state.streak === 7) unlockAchievement('streak_7');
  saveState();
}

/* ============================================================
   5. XP, УРОВНИ, ДОСТИЖЕНИЯ
============================================================ */

function addXP(amount, sourceEl){
  const before = getLevelForXp(state.xp);
  state.xp += amount;
  const after = getLevelForXp(state.xp);
  state.level = after.n;

  // Плавающий +XP
  const float = document.createElement('div');
  float.className = 'xp-float';
  float.textContent = `+${amount} XP`;
  let x = window.innerWidth/2 - 40;
  let y = window.innerHeight/2 - 40;
  if(sourceEl){
    const r = sourceEl.getBoundingClientRect();
    x = r.left + r.width/2 - 40;
    y = r.top + r.height/2;
  }
  float.style.left = x + 'px';
  float.style.top = y + 'px';
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 1300);

  saveState();

  // Level up?
  if(after.n > before.n){
    setTimeout(() => showLevelUp(after), 500);
  }
  updateTopbar();
}

function unlockAchievement(id){
  if(state.achievements.includes(id)) return;
  state.achievements.push(id);
  saveState();
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if(ach) setTimeout(() => showAchievementPopup(ach), 300);
}

/* ============================================================
   6. КОНФЕТТИ
============================================================ */

function fireConfetti(count = 40){
  const root = $('confetti-root');
  const colors = ['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#8064d8','#ff9600'];
  for(let i=0; i<count; i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100) + '%';
    p.style.top = '-20px';
    p.style.background = rand(colors);
    p.style.animationDelay = (Math.random()*0.3) + 's';
    p.style.animationDuration = (1.5 + Math.random()) + 's';
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    root.appendChild(p);
    setTimeout(() => p.remove(), 2500);
  }
}

/* ============================================================
   7. РЕНДЕР: ТОП-БАР
============================================================ */

function updateTopbar(){
  $('streak-val').textContent = state.streak;
  $('xp-val').textContent = state.xp;
  $('level-val').textContent = state.level;
}

/* ============================================================
   8. РЕНДЕР: КАРТА
============================================================ */

function renderMap(){
  state.view = 'map';
  saveState();
  $('topbar').classList.remove('hidden');
  updateTopbar();

  const allDone = CHAPTERS.every(c => state.completedChapters.includes(c.id));
  const totalXp = state.xp;

  let html = `<div class="map">
    <h1 class="map-title">Твой путь</h1>
    <p class="map-sub">${allDone ? 'Все главы пройдены! Ты справилась 💜' : 'Небольшие шаги — большие открытия'}</p>
    <div class="path">`;

  CHAPTERS.forEach((ch, i) => {
    const done = state.completedChapters.includes(ch.id);
    const isFirst = i === 0;
    const prevDone = isFirst || state.completedChapters.includes(CHAPTERS[i-1].id);
    const locked = !done && !prevDone;
    const current = !done && prevDone;

    const nodeClass = done ? 'done' : locked ? 'locked' : current ? 'current' : '';
    const label = done ? 'check' : locked ? '🔒' : ch.icon;
    const cursorStyle = locked ? '' : `onclick="startChapter('${ch.id}')"`;

    if(i > 0){
      html += `<div class="connector"></div>`;
    }

    html += `<div class="node-wrap ${locked ? 'locked' : ''}">
      <div class="node ${nodeClass}" ${cursorStyle}>${label}</div>
      <div class="node-label">${esc(ch.title)}</div>
    </div>`;
  });

  html += `</div>`;

  // Quests
  const quests = [
    { text: 'Пройди 1 главу', done: state.completedChapters.length >= 1 },
    { text: 'Достигни 100 XP', done: state.xp >= 100 },
    { text: 'Ответь на квиз верно', done: state.quizCorrect >= 1 }
  ];
  html += `<div class="side-card">
    <h3>📋 Задания на сегодня</h3>
    ${quests.map(q => `
      <div class="quest ${q.done ? 'done' : ''}">
        <div class="dot">${q.done ? '✓' : ''}</div>
        <div class="q-text">${esc(q.text)}</div>
      </div>
    `).join('')}
  </div>`;

  // Achievements
  html += `<div class="side-card">
    <h3>🏅 Достижения</h3>
    <div class="ach-list">
      ${ACHIEVEMENTS.map(a => {
        const unlocked = state.achievements.includes(a.id);
        return `<div class="ach ${unlocked ? '' : 'locked'}">
          <div class="ach-icon">${a.icon}</div>
          <div class="ach-name">${esc(a.name)}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  html += `</div>`;

  $('view').innerHTML = html;
}

/* ============================================================
   9. СТАРТ ГЛАВЫ
============================================================ */

function startChapter(chapterId){
  const ch = CHAPTERS.find(c => c.id === chapterId);
  if(!ch) return;

  state.currentChapterId = chapterId;
  state.currentQuestionIdx = 0;
  state.selectedAnswer = null;
  state.checked = null;
  state.view = 'lesson';
  saveState();

  renderLesson();
}

/* ============================================================
   10. РЕНДЕР: УРОК
============================================================ */

function getVisibleQuestions(){
  const ch = CHAPTERS.find(c => c.id === state.currentChapterId);
  if(!ch) return [];
  return ch.questions.filter(q => {
    if(!q.showIf) return true;
    const v = state.answers[q.showIf.id];
    if(q.showIf.notValue !== undefined) return v !== q.showIf.notValue;
    return v === q.showIf.value;
  });
}

function renderLesson(){
  $('topbar').classList.add('hidden');

  const ch = CHAPTERS.find(c => c.id === state.currentChapterId);
  const questions = getVisibleQuestions();
  const idx = state.currentQuestionIdx;
  const q = questions[idx];

  if(!q){ finishLesson(); return; }

  const progress = Math.round((idx / questions.length) * 100);

  let html = `<div class="lesson">
    <div class="lesson-head">
      <button class="close-btn" onclick="exitLesson()">✕</button>
      <div class="progress">
        <div class="progress-fill" style="width:${progress}%"></div>
      </div>
    </div>
    <div class="lesson-body">
      <div class="mia-line">
        <div class="mia-avatar">✨</div>
        <div class="mia-bubble">${esc(ch.title)} · ${idx+1} из ${questions.length}</div>
      </div>
      <p class="question-text">${esc(q.question)}</p>
      ${q.hint ? `<p class="question-hint">${esc(q.hint)}</p>` : ''}
      <div class="options">
        ${q.options.map((opt, i) => {
          const selected = state.selectedAnswer === i;
          const checked = state.checked !== null;
          let cls = 'option';
          if(selected) cls += ' selected';
          if(checked){
            cls += ' disabled';
            if(q.type === 'quiz'){
              if(i === q.correct) cls = 'option correct disabled';
              else if(i === state.selectedAnswer) cls = 'option wrong disabled';
            }
          }
          return `<button class="${cls}" onclick="selectOption(${i})">${esc(opt)}</button>`;
        }).join('')}
      </div>
    </div>
    <div class="bottom-bar">
      ${renderCheckButton(q)}
    </div>
  </div>`;

  // Feedback panel (если проверено)
  if(state.checked !== null){
    html = html.replace('</div></div>', `</div>${renderFeedback(q)}</div>`);
    // упростим: вставим после lesson
  }

  $('view').innerHTML = html;
}

function renderCheckButton(q){
  const hasSelection = state.selectedAnswer !== null;

  if(state.checked === null){
    return `<button class="btn btn-3d btn-primary" ${hasSelection ? '' : 'disabled'}
      onclick="checkAnswer()">Проверить</button>`;
  }

  // После проверки
  return `<button class="btn btn-3d btn-primary" onclick="nextQuestion()">
    Продолжить
  </button>`;
}

function renderFeedback(q){
  const isCorrect = state.checked === 'correct';
  const isWrong = state.checked === 'wrong';

  let cls = isCorrect ? 'correct' : isWrong ? 'wrong' : 'correct';
  let icon = isCorrect ? '✓' : isWrong ? '✕' : '✓';
  let head = isCorrect
    ? rand(MIA_CORRECT)
    : isWrong
      ? rand(MIA_WRONG)
      : rand(MIA_SELF);

  const explain = (q.type === 'quiz')
    ? `<div class="feedback-explain">${esc(q.explanation || '')}</div>`
    : '';

  return `<div class="feedback ${cls}">
    <div class="feedback-head">${icon} ${esc(head)}</div>
    ${explain}
  </div>`;
}

/* ============================================================
   11. ДЕЙСТВИЯ УРОКА
============================================================ */

function selectOption(i){
  if(state.checked !== null) return;
  state.selectedAnswer = i;
  saveState();
  renderLesson();
  // Перерисовать кнопку — но renderLesson уже перерисовывает
}

function checkAnswer(){
  if(state.selectedAnswer === null) return;

  const q = getVisibleQuestions()[state.currentQuestionIdx];
  state.answers[q.id] = q.options[state.selectedAnswer];

  if(q.type === 'quiz'){
    if(state.selectedAnswer === q.correct){
      state.checked = 'correct';
      state.quizCorrect++;
      unlockAchievement('quiz_master');
    } else {
      state.checked = 'wrong';
    }
    addXP(10);
    if(state.checked === 'correct') fireConfetti(20);
  } else {
    state.checked = 'self';
    addXP(10);
  }

  saveState();
  renderLessonWithFeedback();
}

function renderLessonWithFeedback(){
  // Перерисовка с feedback
  renderLesson();
  // Принудительно добавляем панель feedback поверх
  const q = getVisibleQuestions()[state.currentQuestionIdx];
  const existing = document.querySelector('.feedback');
  if(existing) existing.remove();
  const div = document.createElement('div');
  div.innerHTML = renderFeedback(q);
  document.body.appendChild(div.firstChild);
}

function nextQuestion(){
  document.querySelectorAll('.feedback').forEach(f => f.remove());
  state.selectedAnswer = null;
  state.checked = null;
  state.currentQuestionIdx++;
  saveState();
  renderLesson();
}

function exitLesson(){
  if(state.checked !== null) return;
  if(!confirm('Выйти из главы? Прогресс главы не сохранится.')) return;
  state.view = 'map';
  state.currentChapterId = null;
  state.currentQuestionIdx = 0;
  saveState();
  renderMap();
}

/* ============================================================
   12. ФИНАЛ ГЛАВЫ
============================================================ */

function finishLesson(){
  const chId = state.currentChapterId;
  if(!state.completedChapters.includes(chId)){
    state.completedChapters.push(chId);
    addXP(20); // бонус за завершение
  }

  if(state.completedChapters.length === CHAPTERS.length){
    unlockAchievement('all_chapters');
  }
  if(state.completedChapters.length >= 1){
    unlockAchievement('first_lesson');
  }

  // Night owl
  const hour = new Date().getHours();
  if(hour >= 22 || hour < 6) unlockAchievement('night_owl');

  state.view = 'results';
  saveState();
  renderResults(chId);
}

function renderResults(chId){
  $('topbar').classList.remove('hidden');
  updateTopbar();

  const ch = CHAPTERS.find(c => c.id === chId);
  const totalDone = state.completedChapters.length;
  const totalCh = CHAPTERS.length;

  fireConfetti(60);

  const html = `<div class="results">
    <div class="big-emoji">🎉</div>
    <h1>Глава пройдена!</h1>
    <p style="color:#afafaf;margin:0 0 20px">${esc(ch.title)}</p>

    <div class="result-stats">
      <div class="result-stat">
        <div class="val">+${ch.questions.length * 10 + 20}</div>
        <div class="lbl">XP</div>
      </div>
      <div class="result-stat">
        <div class="val">${state.streak}</div>
        <div class="lbl">Дней вместе</div>
      </div>
      <div class="result-stat">
        <div class="val">${totalDone}/${totalCh}</div>
        <div class="lbl">Глав</div>
      </div>
    </div>

    ${totalDone === totalCh
      ? `<p style="color:var(--green);font-weight:800;margin-bottom:20px">
           🏆 Ты прошла все главы! Отчёт готов.
         </p>
         <button class="btn btn-3d btn-primary" style="max-width:280px"
           onclick="showClinicalReport()">📄 Открыть отчёт для врача</button>`
      : `<button class="btn btn-3d btn-primary" style="max-width:280px"
           onclick="state.view='map'; saveState(); renderMap()">
           Продолжить путь
         </button>`
    }
  </div>`;

  $('view').innerHTML = html;
}

/* ============================================================
   13. МОДАЛКИ
============================================================ */

function showLevelUp(levelInfo){
  const root = document.getElementById('modal-root') || (() => {
    const d = document.createElement('div'); d.id='modal-root';
    document.body.appendChild(d); return d;
  })();

  root.innerHTML = `<div class="modal-backdrop">
    <div class="modal-card">
      <div style="font-size:64px;animation:pop .6s">🏅</div>
      <h2>Уровень ${levelInfo.n}!</h2>
      <p>${esc(levelInfo.title)}</p>
      <button class="btn btn-3d btn-primary" onclick="closeModal()">Продолжить</button>
    </div>
  </div>`;
  fireConfetti(30);
}

function showAchievementPopup(ach){
  const root = document.getElementById('modal-root') || (() => {
    const d = document.createElement('div'); d.id='modal-root';
    document.body.appendChild(d); return d;
  })();

  root.innerHTML = `<div class="modal-backdrop">
    <div class="modal-card">
      <div style="font-size:64px;animation:pop .6s">${ach.icon}</div>
      <h2>Новое достижение</h2>
      <p>${esc(ach.name)}</p>
      <button class="btn btn-3d btn-primary" onclick="closeModal()">Спасибо!</button>
    </div>
  </div>`;
}

function closeModal(){
  const root = document.getElementById('modal-root');
  if(root) root.innerHTML = '';
}

/* ============================================================
   14. КЛИНИЧЕСКИЙ ОТЧЁТ (упрощённый для демо)
============================================================ */

function showClinicalReport(){
  const answers = state.answers;
  const rows = Object.entries(answers).map(([k, v]) =>
    `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px">
      <span style="color:#afafaf">${esc(k)}</span>
      <span style="font-weight:600">${esc(v)}</span>
    </div>`
  ).join('');

  $('view').innerHTML = `<div style="padding:24px 20px">
    <h1 style="margin-top:0">Резюме для врача</h1>
    <p style="color:#afafaf;margin-bottom:20px">Демо · Данные можно передать врачу</p>
    <div style="background:#f7f7f7;border-radius:16px;padding:16px">
      ${rows || '<p>Нет данных</p>'}
    </div>
    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn btn-3d btn-primary" onclick="exportJSON()">
        📥 Скачать JSON
      </button>
      <button class="btn btn-3d btn-primary" style="background:#afafaf;border-color:#8f8f8f"
        onclick="state.view='map'; saveState(); renderMap()">
        На главную
      </button>
    </div>
  </div>`;
  $('topbar').classList.add('hidden');
}

function exportJSON(){
  const data = {
    version: 1,
    generatedAt: new Date().toISOString(),
    xp: state.xp,
    level: state.level,
    chapters: state.completedChapters,
    answers: state.answers
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `menovia-report-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ============================================================
   15. СТАРТ
============================================================ */

function init(){
  updateStreak();

  // Если был в процессе — продолжить с карты (проще для демо)
  state.view = 'map';
  state.currentChapterId = null;
  state.currentQuestionIdx = 0;
  state.selectedAnswer = null;
  state.checked = null;

  renderMap();
}

document.addEventListener('DOMContentLoaded', init);

// Экспорт для кнопок в HTML
window.startChapter = startChapter;
window.selectOption = selectOption;
window.checkAnswer = checkAnswer;
window.nextQuestion = nextQuestion;
window.exitLesson = exitLesson;
window.closeModal = closeModal;
window.showClinicalReport = showClinicalReport;
window.exportJSON = exportJSON;
</script>
</body>
</html>
